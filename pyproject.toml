[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "flashblocks"
version = "0.2.0"
description = "Chainlink price updates on Base from 200 ms blocks, decoded from the transmit and confirmed from logs_bloom"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: 3", "Topic :: Software Development :: Libraries"]

[project.urls]
Repository = "https://github.com/Dimanoshe/flashblocks-rs"

[tool.maturin]
features = ["python"]
module-name = "flashblocks"
