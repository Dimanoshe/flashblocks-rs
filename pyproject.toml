[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "flashblocks"
version = "0.1.1"
description = "Decode Base Flashblocks in real time: Chainlink price updates from the 200 ms pre-confirmation stream"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: 3", "Topic :: Software Development :: Libraries"]

[project.urls]
Repository = "https://github.com/Dimanoshe/flashblocks-rs"

[tool.maturin]
features = ["python"]
module-name = "flashblocks"
