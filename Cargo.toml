[package]
name = "flashblocks"
version = "0.1.1"
edition = "2024"
description = "Decode Base Flashblocks in real time: Chainlink price updates straight from the 200 ms pre-confirmation stream, with logs_bloom confirmation"
license = "MIT"
repository = "https://github.com/Dimanoshe/flashblocks-rs"
keywords = ["base", "flashblocks", "chainlink", "optimism", "mev"]
categories = ["cryptography::cryptocurrencies", "parsing"]
readme = "README.md"

[lib]
name = "flashblocks"
crate-type = ["cdylib", "rlib"]

[dependencies]
brotli = { version = "7", default-features = false, features = ["std"] }
serde_json = "1"
tiny-keccak = { version = "2", features = ["keccak"] }
memchr = "2"
hex = "0.4"
tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
base64 = "0.22"

[profile.release]
lto = true
codegen-units = 1
